name: build

# Builds the complete mod from source on a clean GitHub-hosted Windows machine:
# script lint, unit tests, BridgeHost publish, 32-bit NVSE plugin, ESP generation/validation,
# and uploads the release archive + SHA256SUMS. Binaries are reproducible (/Brepro, Deterministic).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build, test and package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: MojaveDesktopRadio
          path: |
            dist/MojaveDesktopRadio-*.zip
            dist/SHA256SUMS.txt
