; Mojave Desktop Radio — gameplay / FX settings.
; Edited in game through MCM (Mod Configuration Menu > Mojave Desktop Radio).
; MCM Extender writes this file when the pause menu closes and when the game exits.

[FX]
; 0 = off (pure Spotify sound, no routing), 1 = on
bEnabled = 1
; 0 = Clean, 1 = Mojave Radio, 2 = Wasteland Radio, 3 = Damaged Radio
iPreset = 1
; processed signal volume in percent (only while FX is routed)
iVolume = 100
; 0..100, 50 = preset default
iStaticIntensity = 50
iSaturation = 50
; 1 = use the three values below instead of the preset's filters
bCustomTone = 0
iLowPassHz = 3300
iHighPassHz = 280
iStereoWidth = 20
; station on/off fade in milliseconds (150-350 recommended)
iFadeMs = 250
; short tuning/static sweep when the station is switched on (not for Clean)
bTuningEffect = 1

[Behaviour]
; pause Spotify when the station is switched off or another station is tuned (0 = mute instead)
bAutoPause = 1
; start playback when the station is tuned
bAutoPlay = 1
; Esc menu: 0 = keep playing, 1 = pause, 2 = lower volume
iPauseMenu = 0
; corner message on track change
bTrackMessages = 1

[Player]
; desktop music player the station controls. 0 = Spotify (default, tested)
; optional, untested: 1 = foobar2000, 2 = MusicBee, 3 = AIMP, 4 = WACUP / Winamp,
; 5 = Custom (sessionMatch / audioProcessNames in %LOCALAPPDATA%\MojaveDesktopRadio\settings.json)
; Other players work only if they show up in the Windows media controls (volume overlay).
iPlayer = 0

[Keys]
; DirectInput scan codes, 0 = unassigned (default — nothing is taken over)
iPlayPause = 0
iNext = 0
iPrevious = 0
iCycleFx = 0
; 0 = only on the Pip-Boy Radio tab, 1 = also outside menus
iScope = 0
