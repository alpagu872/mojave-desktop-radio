; Mojave Desktop Radio — technical settings and Pip-Boy texts for MojaveDesktopRadio.dll
; (gameplay/FX options are in Data\Config\MojaveDesktopRadio.ini and in MCM)
; Text values are written in the game's code page. Quote a value to keep trailing spaces: "ARTIST: "

[General]
; named pipe used to talk to the BridgeHost (letters, digits, - _ . only).
; The plugin starts the BridgeHost with this name, so nothing else has to be changed.
sPipeName = MojaveDesktopRadio
; 0 = automatic (the Windows ANSI code page: 1254 Turkish, 1252 Western, 1251 Cyrillic, ...)
; set a number only if your game text uses a different code page than Windows
iCodePage = 0
; Artist / title are shortened to this many characters on the Pip-Boy
iMaxTextChars = 40
; writes extra lines to MojaveDesktopRadio.log in the game folder
bDebugLog = 0

[Bridge]
; start the BridgeHost automatically when a save is loaded and it is not running
bAutoLaunch = 1
; empty = Data\MojaveDesktopRadio\BridgeHost\MojaveDesktopRadio.exe (shipped with the mod),
;         then %LOCALAPPDATA%\MojaveDesktopRadio\app\MojaveDesktopRadio.exe
sPath =
iLaunchDelayMs = 1500
; advanced: extra command-line arguments for the BridgeHost, e.g. --verbose
sExtraArgs =

[Text]
sSignalConnected = "SIGNAL: CONNECTED"
sSignalLost = "SIGNAL LOST"
sSignalBridgeOffline = "SIGNAL LOST - BRIDGE OFFLINE"
; %s in the next two lines and in sMsgPlayerNotFound = the player's name (MCM > Desktop Player)
sPlayerNotFound = "STATUS: %s NOT RUNNING"
sPlayerNoSession = "STATUS: PRESS PLAY IN %s ONCE"
sStatusPlaying = "STATUS: PLAYING"
sStatusPaused = "STATUS: PLAYBACK PAUSED"
sStatusStopped = "STATUS: STOPPED"
sArtistPrefix = "ARTIST: "
sTrackPrefix = "TRACK : "
sFxPrefix = "FX MODE: "
sFxClean = "CLEAN"
sFxMojave = "MOJAVE RADIO"
sFxWasteland = "WASTELAND RADIO"
sFxDamaged = "DAMAGED RADIO"
sFxOff = "OFF"
sFxPendingSuffix = " (TUNING...)"
sFxUnavailableSuffix = " (NO ROUTE - CLEAN)"
sLabelPlay = "> PLAY"
sLabelPause = "> PAUSE"
sLabelNext = "> NEXT TRACK"
sLabelPrevious = "> PREVIOUS TRACK"
sLabelFx = "> CHANGE FX MODE"
; %s = "Artist - Title"
sNowPlayingFormat = "Now Playing: %s"
sMsgBridgeOffline = "Mojave Desktop Radio: BridgeHost is not running"
sMsgPlayerNotFound = "Mojave Desktop Radio: %s is not running"
